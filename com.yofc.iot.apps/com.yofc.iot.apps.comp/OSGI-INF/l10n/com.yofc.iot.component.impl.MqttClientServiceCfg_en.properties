name=MQTT Client Connection
description=The MqttDataTransport provides an MQTT connection. Its configuration parameters are used to determine the MQTT broker and the credentials to connect to the broker.
activate=Enabled
activateDesc=Start Client instance
brokerUrl=Broker-url
brokerUrlDesc=URL of the mqtt broker to connect to.
username=Username
usernameDesc=Username to be used when connecting to the MQTT broker.
password=Password
passwordDesc=Password to be used when connecting to the MQTT broker.
clientId=Client-id
clientIdDesc=Client identifier to be used when connecting to the MQTT broker. The identifier has to be unique within your account. Characters '/', '+', '#' and '.' are invalid and they will be replaced by '-'. If left empty, this is automatically determined by the client software as the MAC address of the main network interface (in general uppercase and without ':').
postProcess=Post Process
postProcessDesc=Groovy post process for usname,password,client_id etc.
postProcessCode=Post Process Code
postProcessCodeDesc=Groovy code for post process\u200B\u200B\u200B\u200B\u200B
keepAliveInterval=Keep-alive
keepAliveIntervalDesc=Frequency in seconds for the periodic MQTT PING message.
connectionTimeout=Timeout
connectionTimeoutDesc=Timeout used for all interactions with the MQTT broker.
cleanSession=Clean-session
cleanSessionDesc=MQTT Clean Session flag.
mqttVersion=Protocol-version
mqttVersionDesc=MQTT Protocol Version.
willTopic=LWT Topic
willTopicDesc=MQTT Last Will and Testament topic. The tokens '#account-name' and '#client-id' will be replaced by the values of the properties topic.context.account-name and client-id
willPayload=LWT Payload
willPayloadDesc=MQTT Last Will and Testament payload as a string.
willQos=LWT Qos
willQosDesc=MQTT Last Will and Testament QoS (0..2).
willRetain=LWT Retain
willRetainDesc=MQTT Last Will and Testament Retain flag.
persistenceType=In-flight Persistence
persistenceTypeDesc=Storage type where in-flight messages are persisted across reconnections.
autoConnect=Auto Connect
autoConnectDesc=Auto connect if connection lost
connectDelay=Connect Retry-interval
connectDelayDesc=Frequency in seconds to retry a connection of the MQTT client after a disconnect (Minimum value 1).
sslManagerServiceTarget=SslManagerService Target
sslManagerServiceTargetDesc=SslManagerService Target