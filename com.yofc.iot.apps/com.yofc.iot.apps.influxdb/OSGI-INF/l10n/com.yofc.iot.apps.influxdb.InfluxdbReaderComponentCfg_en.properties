name=InfluxDB v2 Reader
description=A configurable reader for InfluxDB v2. Wire a Timer to trigger it; configure measurement + fields for simple mode, optional Groovy script for post-processing.
url=URL
urlDesc=InfluxDB URL, e.g. http://localhost:8086
token=Token
tokenDesc=Authentication token for InfluxDB v2
organization=Organization
organizationDesc=InfluxDB organization name
bucket=Bucket
bucketDesc=InfluxDB bucket name (v2 mode)
username=Username
usernameDesc=Username (v1 compatibility mode)
password=Password
passwordDesc=Password (v1 compatibility mode)
database=Database
databaseDesc=Database name (v1 compatibility mode)
retentionPolicy=Retention Policy
retentionPolicyDesc=Retention policy (v1 compatibility mode)
measurement=Measurement
measurementDesc=Measurement name to read from
fields=Fields
fieldsDesc=Comma-separated field names to read, e.g. temperature,humidity,pressure
range=Range
rangeDesc=Flux range start, e.g. -5m, -1h, -24h
script=Script
scriptDesc=Optional Groovy script. After auto-query, the result Map is injected as 'input' and you can transform/filter it. Set 'output' to emit the result downstream. Available bindings: dbClient, logger, webClient, vertx, input, output.|Editor:groovy
initScript=Init Script
initScriptDesc=Groovy initialization script (runs once). Optional: define init()/destroy() lifecycle methods.|Editor:groovy
