name=InfluxDB v2 读取器
description=可配置的 InfluxDB v2 读取组件。用 Timer 连线触发；配置 measurement + fields 即可自动查询，可选 Groovy 脚本对查询结果做后处理再 emit 到下游。
url=地址
urlDesc=InfluxDB 地址，例如 http://localhost:8086
token=Token
tokenDesc=InfluxDB v2 认证 Token
organization=组织
organizationDesc=InfluxDB 组织名称
bucket=Bucket
bucketDesc=InfluxDB bucket 名称（v2 模式）
username=用户名
usernameDesc=用户名（v1 兼容模式）
password=密码
passwordDesc=密码（v1 兼容模式）
database=数据库
databaseDesc=数据库名称（v1 兼容模式）
retentionPolicy=保留策略
retentionPolicyDesc=保留策略（v1 兼容模式）
measurement=测量
measurementDesc=要读取的 measurement 名称
fields=字段
fieldsDesc=要读取的字段名，逗号分隔，例如 temperature,humidity,pressure
range=范围
rangeDesc=Flux 查询时间范围，例如 -5m, -1h, -24h
script=脚本
scriptDesc=可选 Groovy 脚本。自动查询结果会以 Map 注入为 'input'，可做转换/过滤。设置 'output' 以 emit 到下游。可用绑定：dbClient、logger、webClient、vertx、input、output。|Editor:groovy
initScript=初始化脚本
initScriptDesc=Groovy 初始化脚本（仅执行一次）。可选：定义 init()/destroy() 生命周期方法。|Editor:groovy
